<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 챗봇 · 이다연의 포트폴리오</title>
<meta name="description" content="이다연의 이력서 기반 AI 챗봇에게 질문해보세요">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="page">

<nav class="nav">
  <a href="index.html" class="nav__brand">이다연의 포트폴리오</a>
  <button class="nav__toggle" aria-label="메뉴 열기" aria-expanded="false">
    <span></span>
  </button>
  <div class="nav__links">
    <a href="index.html" class="nav__link nav-label">홈</a>
    <a href="spec.html" class="nav__link nav-label">스펙</a>
    <a href="project.html" class="nav__link nav-label">프로젝트</a>
    <a href="chatbot.html" class="nav__link nav-label is-active">AI 챗봇</a>
    <a href="contact.html" class="nav__link nav-label">연락처</a>
  </div>
</nav>

<main class="page__main">
  <section class="section chat-wrap">
    <div class="chat-panel">
      <div style="display:flex; flex-direction:column; gap:10px;">
        <span class="caption eyebrow">AI CHAT</span>
        <h1 class="h1">AI 챗봇에게 물어보세요</h1>
        <p class="body-small" style="color:var(--ink-secondary);">이력서 내용을 바탕으로 궁금한 점에 답해드려요.</p>
      </div>

      <div class="card chat-box">
        <div class="chat-log" id="chatLog" aria-live="polite">
          <div class="bubble bubble--user"><span class="body-small">주로 어떤 프로젝트를 진행하셨나요?</span></div>
          <div class="bubble bubble--bot"><span class="body-small">동인행사 부스용 재고관리 앱을 React와 Capacitor로 개발했어요. 로컬 스토리지 기반으로 동작하고, 구글플레이 출시를 목표로 하고 있습니다.</span></div>
        </div>

        <div class="chat-input">
          <div class="chat-input__row">
            <textarea id="chatText" placeholder="궁금한 점을 입력해 주세요" rows="1" maxlength="500"></textarea>
            <button class="chat-send" type="button" disabled>전송</button>
          </div>
          <span class="caption chat-count">0/500</span>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <span class="caption">© 2026 이다연 · Built with AWS</span>
</footer>

<script src="assets/js/nav.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/chatbot.js"></script>
</body>
</html>
